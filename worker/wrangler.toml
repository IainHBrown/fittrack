# Cloudflare Worker for Fitness Tracker (free plan).
# Deploy from this folder with:  npx wrangler deploy
# The private secret is NOT in this file. Set it once with:
#   npx wrangler secret put APP_SECRET

name = "fittrack"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Workers AI: photo estimates (10,000 free neurons a day)
[ai]
binding = "AI"

# Workers KV: cloud backup and the daily estimate counter (free: 1 GB, 1,000 writes a day)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Web addresses allowed to call this Worker from a browser.
ALLOWED_ORIGINS = "https://iainhbrown.github.io,http://localhost:8080,http://localhost:8081"
# Vision models to try, in order.
VISION_MODELS = "@cf/meta/llama-4-scout-17b-16e-instruct,@cf/meta/llama-3.2-11b-vision-instruct"
# Most photo estimates allowed per day.
DAILY_ESTIMATES = "80"
